# Prometheus Configuration for Ethical AI Advisor
# Scrapes metrics from FastAPI application every 5 seconds

global:
  scrape_interval: 5s  # How often to scrape targets
  evaluation_interval: 5s  # How often to evaluate rules
  external_labels:
    monitor: 'ethical-ai-advisor'
    environment: 'production'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Rule files for alerts
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Job 1: Scrape FastAPI application metrics
  - job_name: 'fastapi-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']  # Docker service name
        labels:
          service: 'ethical-ai-advisor'
          component: 'api'
    
  # Job 2: Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'monitoring'
          component: 'prometheus'

  # Job 3: PostgreSQL metrics (if using postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'database'
          component: 'postgresql'

  # Job 4: Redis metrics (if using redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'cache'
          component: 'redis'
