version: '3.8'

services:
  # =========================================================================
  # PHASE 4: MONITORING STACK (NEW)
  # =========================================================================
  
  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: advisor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - advisor-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Grafana - Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: advisor-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana_dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - advisor-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =========================================================================
  # PHASE 3: APPLICATION STACK (UPDATED FOR PHASE 4)
  # =========================================================================
  
  # FastAPI Application (with Prometheus metrics)
  api:
    build: .
    container_name: ethical-ai-advisor
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://advisor:advisor123@postgres:5432/advisor_db
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongo:27017/audit_logs
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - mongo
    restart: unless-stopped
    networks:
      - advisor-network
    command: uvicorn main_phase4:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL for Investor Profiles
  postgres:
    image: postgres:15-alpine
    container_name: advisor-postgres
    environment:
      - POSTGRES_USER=advisor
      - POSTGRES_PASSWORD=advisor123
      - POSTGRES_DB=advisor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - advisor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching (Phase 4 optimization)
  redis:
    image: redis:7-alpine
    container_name: advisor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - advisor-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for Audit Logs
  mongo:
    image: mongo:7
    container_name: advisor-mongo
    environment:
      - MONGO_INITDB_DATABASE=audit_logs
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - advisor-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker (for background tasks)
  celery-worker:
    build: .
    container_name: advisor-celery-worker
    command: celery -A celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://advisor:advisor123@postgres:5432/advisor_db
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongo:27017/audit_logs
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
      - mongo
      - postgres
    restart: unless-stopped
    networks:
      - advisor-network

  # =========================================================================
  # PHASE 4: OPTIONAL EXPORTERS (for advanced metrics)
  # =========================================================================
  
  # Redis Exporter (optional - for detailed Redis metrics)
  # redis-exporter:
  #   image: oliver006/redis_exporter:latest
  #   container_name: advisor-redis-exporter
  #   ports:
  #     - "9121:9121"
  #   environment:
  #     - REDIS_ADDR=redis:6379
  #   depends_on:
  #     - redis
  #   networks:
  #     - advisor-network

  # Postgres Exporter (optional - for detailed DB metrics)
  # postgres-exporter:
  #   image: prometheuscommunity/postgres-exporter:latest
  #   container_name: advisor-postgres-exporter
  #   ports:
  #     - "9187:9187"
  #   environment:
  #     - DATA_SOURCE_NAME=postgresql://advisor:advisor123@postgres:5432/advisor_db?sslmode=disable
  #   depends_on:
  #     - postgres
  #   networks:
  #     - advisor-network

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  prometheus-data:  # NEW: Prometheus metrics storage
  grafana-data:     # NEW: Grafana dashboards storage

networks:
  advisor-network:
    driver: bridge
